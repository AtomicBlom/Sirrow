name: CI

# The audio, its outputs and effects build warning-clean and their tests pass. Nothing here needs a GPU
# or a window, so a hosted Linux runner does it all; the real-device test (SdlAudioDeviceTests) skips there, having no
# SDL3.dll for Linux and no output.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
      - name: Build
        run: dotnet build BinaryVibrance.Sirrow.slnx -c Release
      - name: Test
        run: dotnet test --project BinaryVibrance.Sirrow.Tests/BinaryVibrance.Sirrow.Tests.csproj -c Release --no-build

  # BinaryVibrance.Sirrow.Android is in no solution, so a desktop build never needs the android workload; it builds here, where
  # the workload is installed
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
      - name: Install the android workload
        run: dotnet workload install android
      - name: Build
        run: dotnet build BinaryVibrance.Sirrow.Android/BinaryVibrance.Sirrow.Android.csproj -c Release
